[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-mcmc"
version = "0.1.0"
description = "Algorithms for Parallel Evaluation of MCMC Samplers"
requires-python = ">=3.11"
readme = "README.md"
license = {file="LICENSE"}
dependencies = [
  # Pinned stack: TensorFlow 2.16 + JAX 0.4.x + TFP (JAX) + NumPy 1.26.
  # Newer JAX needs ml-dtypes>=0.4, which conflicts with TF 2.16; SciPy>=1.14
  # breaks JAX 0.4.23's scipy.linalg expectations.
  "numpy==1.26.4",
  "scipy==1.11.4",
  "ml-dtypes==0.3.2",
  "jax==0.4.23",
  "jaxlib==0.4.23",
  "tensorflow==2.16.2",
  "tensorflow-probability==0.24.0",
  "tensorflow-datasets==4.9.9",
  "inference_gym==0.0.5",
  "matplotlib",
  "imageio",
  "jaxtyping",
  "tqdm",
]
authors = [
    {name="David Zoltowski"}, 
    {name="Skyler Wu"}, 
    {name="Xavier Gonzalez"}, 
    {name="Leo Kozachkov"}, 
    {name="Scott Linderman"}
]
maintainers = [
    {name="David Zoltowski", email="dzoltow@stanford.edu"},
]

[project.urls]
repository = "https://github.com/lindermanlab/parallel-mcmc"
homepage = "https://github.com/lindermanlab/parallel-mcmc"

[tool.setuptools.packages.find]
where = ["."]
